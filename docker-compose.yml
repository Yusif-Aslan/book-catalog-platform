services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookcatalog
      POSTGRES_USER: bookcatalog
      POSTGRES_PASSWORD: bookcatalog
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookcatalog -d bookcatalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BookCatalog: Host=db;Port=5432;Database=bookcatalog;Username=bookcatalog;Password=bookcatalog
      Database__MigrateOnStartup: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  db-data: